# Игро-специфичные параметры среды (ML_CONCEPT §10)
# Путь: games/rushn_attack/env_config.yaml

actions:
  - ""
  - left
  - right
  - down
  - up
  - right+up
  - left+up
  - A
  - B
  - start

lives:
  min: 0
  max: 9

# H3: штрафы за каждую потерю жизни; выход эпизода RnA — только game-over-freeze
# (не бюджет N смертей).
death_mode: game_over
# Игнорировать dip lives на смене комнаты (streak ≤3); confirm должен быть больше.
death_confirm_steps: 4

# Конец попытки (train + inference): durable game over freeze.
# Поля title_* — якоря для отличия game over от title standing (y∉title_ys).
# Shell-клипы: games/rushn_attack/reference/game_over_to_attract*.fm2
episode_end_title:
  rooms: ["0x00"]
  title_x: 129
  title_ys: [131, 133, 135]
  # Стоп на экране game over до title/attract (TASK_STOP_TITLE_ATTRACT).
  game_over_freeze_confirm_steps: 32
  # Гейт «попытка началась» для freeze (не стопить чистый power-on intro).
  min_attempt_steps: 120
  level_room_min: "0x08"
  # Truncate grace у max_episode_steps.
  truncate_grace_steps: 40
  truncate_cool_steps: 16

# Детектор фазы экрана → info.phase_id (TASK_POLICY_SEPARATION).
# Ядро только читает строку; match-числа только здесь (плагин).
# Порядок: title (pose) → game over pose (intro) → mission play (gameplay) → иначе intro.
# m1: коридор room 0x00 — gameplay после cp_gameplay*/cp_bossfight* (sticky по save),
# не residual intro. level_room_min — deep rooms / sticky; gameplay_min_stage — опц. stage≥N.
screen_phases:
  level_room_min: "0x08"
  mission_save_prefixes: ["cp_gameplay", "cp_bossfight"]
  # stage≥1 = уже прошли стартовый участок; stage=0 на cp_gameplay0 закрывает sticky по save.
  gameplay_min_stage: 1
  # y на GAME OVER из эталона (не путать с любым y∉title_ys в коридоре).
  game_over_ys: [41, 95]
  title:
    rooms: ["0x00"]
    x: 129
    ys: [131, 133, 135]

# Multi-head: phase_id → head_id (+ маски действий). Один models/genN.zip.
# title — жать start; intro — только noop;
# gameplay / bossfight — все действия кроме start (чтобы не ловить паузу в уровне).
# Детектор bossfight — later.
# isolation: ядро только читает forbid/required_phases (без литералов RnA в train).
policy_heads:
  default_head: gameplay
  heads: [title, intro, gameplay, bossfight]
  phase_to_head:
    title: title
    intro: intro
    gameplay: gameplay
    bossfight: bossfight
  action_masks:
    title: ["", "start"]
    intro: [""]
    gameplay: ["", "left", "right", "down", "up", "right+up", "left+up", "A", "B"]
    bossfight: ["", "left", "right", "down", "up", "right+up", "left+up", "A", "B"]
  isolation:
    forbid:
      - head: gameplay
        phases: [title, intro]
      - head: bossfight
        phases: [title, intro]
    required_phases: [gameplay]
