# Heuristics сборки эталона (Strategy → src/playthrough_build.py)
# Игро-специфично; новая игра — свой etalon_build.yaml + ссылка в game.yaml

transition_rooms:
  - "0xFF"
  - "0x13"
  - "0x05"
  - "0x04"
  - "0x03"
  - "0x02"
  - "0x01"

# Критерий кадра «управляемый gameplay» (не title/fade). Ядро только интерпретирует.
gameplay_start:
  exclude_transition_rooms: true
  lives_min: 1
  lives_max: 9
  # move_or_attack — нужен direction/A/B; одного start недостаточно (intro).
  require_input: move_or_attack

# Дефолтный блок rewards при генерации routes.yaml (миссия может переопределить вручную).
rewards_default:
  checkpoint_bonus: 100
  death_penalty: 40
  mission_clear_bonus: 1000
  step_penalty: 0.005
  kill_bonus: 0

checkpoint_names:
  - start
  - first_screen
  - ladder
  - mid_mission
  - late_mission

segment_count: 5

checkpoint_heuristics:
  - kind: first_non_transition_room
  - kind: first_room
    room: "0x0C"
  - kind: first_room
    room: "0x08"
  - kind: first_room
    room: "0x12"
  - kind: first_room_min_y
    room: "0x00"
    min_y: 60
    after_first_room: "0x12"
